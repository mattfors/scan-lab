<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scan Lab</title><script defer="defer" src="bundle.js"></script></head><body><div x-data="app" x-init="init()"><button @click="fakeScan">Fake Scan</button> <button @click="clearData">Clear Local Data</button><div id="scan-timeline-root"></div><div style="margin: 20px 0; max-width: 800px;"><h3>Hello World Line Chart</h3><canvas id="helloWorldChart"></canvas></div><div id="events"><h3>Events:</h3><template x-for="event in events" :key="event._id"><div class="event-item"><div><strong>Event Type:</strong> <span x-text="event.eventType"></span></div><div class="event-time"><strong>Time:</strong> <span x-text="event.ts"></span></div><div class="event-id"><strong>ID:</strong> <span x-text="event._id"></span></div><div x-show="event.data" class="event-data"><strong>Data:</strong> <span x-text="event.data"></span></div></div></template><div x-show="events.length === 0"><p>No events yet. Click the button above or type and press Enter!</p></div></div></div></body></html>
