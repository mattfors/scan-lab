<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Lab</title>
</head>
<body>
    <div x-data="app" x-init="init()">
        <button @click="fakeScan">Fake Scan</button>
        <button @click="clearData">Clear Local Data</button>
        <div id="scan-timeline-root"></div>
        
        <!-- Delta Time Histogram -->
        <div style="margin: 20px 0;">
            <h3>Delta Time Histogram</h3>
            <canvas id="deltaTimeHistogram"></canvas>
        </div>
        
        <div id="events">
            <h3>Events:</h3>
            <div id="eventsGrid" class="ag-theme-alpine" style="width: 100%;"></div>
            <div x-show="events.length === 0">
                <p>No events yet. Click the button above or type and press Enter!</p>
            </div>
        </div>
    </div>
</body>
</html>
