<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Lab</title>
</head>
<body>
    <div x-data="app" x-init="init()">
        <button @click="fakeScan">Fake Scan</button>
        <button @click="clearData">Clear Local Data</button>
        
        <!-- Speed Metrics Charts (New Row) -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 20px 0;">
            <div>
                <canvas id="scanSpeedChart"></canvas>
            </div>
            <div>
                <canvas id="accelerationChart"></canvas>
            </div>
            <div>
                <canvas id="speedVariabilityChart"></canvas>
            </div>
        </div>
        
        <!-- Rolling Statistics Charts -->
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 20px 0;">
            <div>
                <canvas id="rollingMeanChart"></canvas>
            </div>
            <div>
                <canvas id="rollingStdLogChart"></canvas>
            </div>
            <div>
                <canvas id="deltaVsIndexChart"></canvas>
            </div>
            <div>
                <canvas id="zDeltaChart"></canvas>
            </div>
        </div>
        
        <div id="events">
            <h3>Events:</h3>
            <div id="eventsGrid" class="ag-theme-balham" style="width: 100%;"></div>
            <div x-show="events.length === 0">
                <p>No events yet. Click the button above or type and press Enter!</p>
            </div>
        </div>
    </div>
</body>
</html>
