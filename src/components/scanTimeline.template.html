<section class="scan-timeline">
  <div class="timeline-header">
    <h3>Scan Timeline</h3>
    <div class="timeline-meta">
      <span x-text="`${scanTimeline.scanCount} scans`"></span>
      <span>(Last 90 seconds)</span>
    </div>
  </div>
  <div class="timeline-chart-container">
    <canvas id="scanTimelineChart"></canvas>
    <div class="timeline-empty" x-show="scanTimeline.scanCount === 0">
      No scans yet. Start scanning to see timing gaps.
    </div>
  </div>
</section>
